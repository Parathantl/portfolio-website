name: parathan-blog

services:
  # PostgreSQL Database - localhost only (use SSH tunnel for remote access)
  postgres:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - blog-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend Service (NestJS) - Exposed to localhost only for Nginx
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Only accessible from host, not publicly
    volumes:
      - ./uploads:/app/uploads
    networks:
      - blog-network
    environment:
      # App Settings
      - NODE_ENV=production
      - PORT=3001

      # Database - connects to postgres container
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE}

      # JWT
      - JWT_SECRET=${JWT_SECRET}

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}

      # Email
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - CONTACT_EMAIL=${CONTACT_EMAIL}

      # Storage
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - APP_URL=${APP_URL}

      # Cloudinary (only used if STORAGE_PROVIDER=cloudinary)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Frontend Service (Next.js) - Proxied through Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Expose on port 3000 for Nginx proxy
    networks:
      - blog-network
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

# DMS Implementation
  dms-postgres:                                                                                                                                                                                         
      image: postgres:17-alpine                                                                                                                                                                           
      container_name: dms-postgres
      restart: unless-stopped                                                                                                                                                                             
      networks: [blog-network]                              
      environment:                                                                                                                                                                                        
        - POSTGRES_USER=${DMS_POSTGRES_USER}
        - POSTGRES_PASSWORD=${DMS_POSTGRES_PASSWORD}                                                                                                                                                      
        - POSTGRES_DB=${DMS_POSTGRES_DB}                    
      volumes:                                                                                                                                                                                            
        - dms_postgres_data:/var/lib/postgresql/data        
      healthcheck:                                                                                                                                                                                        
        test: ["CMD-SHELL", "pg_isready -U ${DMS_POSTGRES_USER} -d ${DMS_POSTGRES_DB}"]
        interval: 10s                                                                                                                                                                                     
        timeout: 5s
        retries: 5
      ports:                                                                                                                                                                                              
        - "127.0.0.1:5433:5432"                                                                                                                                                                                 
                                                                                                                                                                                                            
  dms-backend:
    build:                                                                                                                                                                                              
      context: ../distribution-mgt/distribution-mgt-backend                 
      dockerfile: Dockerfile
    container_name: dms-backend
    restart: unless-stopped                                                                                                                                                                             
    ports:
      - "127.0.0.1:3002:3000"                                                                                                                                                                           
    networks: [blog-network]                              
    environment:                                                                                                                                                                                        
      - NODE_ENV=production
      - PORT=3000                                                                                                                                                                                       
      - DB_HOST=dms-postgres                              
      - DB_PORT=5432
      - DB_USER=${DMS_POSTGRES_USER}                                                                                                                                                                    
      - DB_PASSWORD=${DMS_POSTGRES_PASSWORD}
      - DB_NAME=${DMS_POSTGRES_DB}                                                                                                                                                                      
      - DB_SSL=false                                      
      - JWT_SECRET=${DMS_JWT_SECRET}                                                                                                                                                                    
    depends_on:                                                                                                                                                                                         
      dms-postgres:
        condition: service_healthy                                                                                                                                                                      

  dms-frontend:
    build:
      context: ../distribution-mgt/distribution-mgt-frontend
      dockerfile: Dockerfile                                                                                                                                                                            
      args:
        - VITE_API_URL=https://dms-api.parathan.com/api                                                                                                                                                 
    container_name: dms-frontend                                                                                                                                                                        
    restart: unless-stopped
    ports:                                                                                                                                                                                              
      - "127.0.0.1:3011:80"                               
    networks: [blog-network]                                                                                                                                                                            
    depends_on: [dms-backend]                                
                          
networks:
  blog-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  dms_postgres_data:
      driver: local